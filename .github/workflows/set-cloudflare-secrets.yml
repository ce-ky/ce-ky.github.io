name: Set Cloudflare Worker secrets

# Manual only — run this from the Actions tab whenever the OAuth secret
# needs to be (re)set. Plain `wrangler secret put` refuses to run here
# ("the latest version of your Worker isn't currently deployed") because
# this project uses Cloudflare's Workers Builds/versions flow, where a
# git-triggered build doesn't necessarily become the live version. This is
# also almost certainly why GITHUB_CLIENT_ID and GITHUB_CLIENT_SECRET kept
# reading back as unset in /status: `wrangler versions secret put` sets
# the secret directly at the Worker level, independent of which version
# happens to be live.
on:
  workflow_dispatch:

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Put GITHUB_CLIENT_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo -n "${{ secrets.DECAP_GITHUB_CLIENT_SECRET }}" \
            | npx wrangler@latest versions secret put GITHUB_CLIENT_SECRET --name ce-ky-github-io

      # Belt-and-suspenders: make sure the currently-committed code (with
      # GITHUB_CLIENT_ID from wrangler.toml) is the version actually
      # receiving 100% of traffic, not just an uploaded-but-unpromoted one.
      - name: Deploy latest version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@latest deploy
