name: Set Cloudflare Worker secrets

# Manual only — run this from the Actions tab whenever the OAuth secrets
# need to be (re)set. The Cloudflare dashboard's "Variables and secrets"
# panels haven't been reliably sticking across Workers Builds deploys for
# this project, so this sets them directly via the Cloudflare API instead
# (`wrangler secret put`), which stores them at the account/script level —
# independent of any deploy.
on:
  workflow_dispatch:

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Put GITHUB_CLIENT_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo -n "${{ secrets.DECAP_GITHUB_CLIENT_SECRET }}" \
            | npx wrangler@latest secret put GITHUB_CLIENT_SECRET --name ce-ky-github-io
