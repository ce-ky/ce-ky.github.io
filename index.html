<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ceky</title>
    <link rel="icon" href="favicon.ico">

    <link rel="stylesheet" href="style.css">

    <!-- Preload the primary pixel font so text doesn't flash on load -->
    <link rel="preload" href="fonts/zpix.ttf" as="font" type="font/ttf" crossorigin>
  </head>
  <body>
    <header>
      <!-- Navigation bar container -->
      <div id="navbar"></div>
    </header>

    <main class="content">
      <section>
        <h1>HELLO</h1>
      </section>
      <section class="table">
        <div>
          <form>
            <label for="name">Name:</label>
            <input autocomplete="off" type="text" id="name" name="name" required>
            <input type="submit">
          </form>
          <div class="prose">
            <p>Hi, I'm Ceky, a game developer and artist from Taiwan.</p>
            <p>I love making games and drawing.</p>
            <p>Currently working on my own game project.</p>
            <p>Feel free to contact me if you have any questions or just want to chat!</p>
            <p>我是尺原！</p>
            <p>集合链接在下面可以找到：↓</p>
            <p>做各种各样的东西。</p>
          </div>
        </div>
      </section>
    </main>

    <script>
      // Load the shared navigation bar
      fetch('navbar.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('navbar').innerHTML = data;
        })
        .catch(error => console.error('Error loading navigation:', error));
    </script>
    <script>
      document.querySelector('form').addEventListener('submit', function (event) {
        event.preventDefault();
        alert('hello, ' + document.querySelector('#name').value);
      });
    </script>
  </body>
</html>
