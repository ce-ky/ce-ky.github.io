<main class="content home-content">
  <div id="planet-canvas" class="home-planet"></div>
</main>

<script src="/libs/p5.min.js"></script>
<script>
  const sketch = function (p) {
    const SIZE = 480;
    const RADIUS = 160;
    const CELL = 9;
    let craters = [];

    // monochrome 5-tone ramp from dark terrain to bright peaks, paired
    // with an ASCII density ramp of the same length
    const PALETTE = [
      [40, 40, 40],
      [85, 85, 85],
      [130, 130, 130],
      [190, 190, 190],
      [255, 255, 255]
    ];
    const RAMP = ['.', ':', '+', '*', '#'];
    const SATELLITE_RAMP = ['.', 'o', '*', '@'];
    const ROTATE_SPEED = 0.004;
    const ORBIT_SPEED = 0.008;
    let satellites = [];

    p.setup = function () {
      const cnv = p.createCanvas(SIZE, SIZE);
      cnv.parent('planet-canvas');
      p.pixelDensity(1);
      p.noStroke();
      p.textFont('monospace');
      p.textSize(CELL * 1.3);
      p.textAlign(p.CENTER, p.CENTER);
      p.randomSeed(7);
      for (let i = 0; i < 10; i++) {
        const ang = p.random(p.TWO_PI);
        const r = p.random(RADIUS * 0.15, RADIUS * 0.85);
        craters.push({ x: r * p.cos(ang), y: r * p.sin(ang), r: p.random(6, 22) });
      }

      // a ring of small circles of varying size, orbiting the planet
      // around the Z axis (i.e. sweeping around in the view plane)
      const SATELLITE_COUNT = 18;
      for (let i = 0; i < SATELLITE_COUNT; i++) {
        satellites.push({
          angle: (i / SATELLITE_COUNT) * p.TWO_PI + p.random(-0.15, 0.15),
          orbitRadius: p.random(RADIUS + 25, RADIUS + 65),
          size: p.random(3, 12)
        });
      }
    };

    p.draw = function () {
      p.clear();
      p.push();
      p.translate(SIZE / 2, SIZE / 2);

      // soft atmosphere glow
      p.noFill();
      for (let g = 6; g > 0; g--) {
        p.stroke(255, 255, 255, 10);
        p.strokeWeight(g * 2);
        p.circle(0, 0, RADIUS * 2 + g * 6);
      }

      p.noStroke();

      // spin around the Z axis: rotate the terrain sampling in-plane
      // instead of scrolling it, so the whole disc appears to turn like a
      // record rather than a globe spinning on a vertical axis
      const angle = p.frameCount * ROTATE_SPEED;
      const ca = p.cos(-angle);
      const sa = p.sin(-angle);

      for (let y = -RADIUS; y <= RADIUS; y += CELL) {
        for (let x = -RADIUS; x <= RADIUS; x += CELL) {
          const d = p.sqrt(x * x + y * y);
          if (d > RADIUS) continue;

          // black terminal backdrop per cell, not a smooth circle, so the
          // silhouette comes out as a rough, stair-stepped edge instead of
          // a perfect circle
          p.fill(0, 0, 0);
          p.rect(x, y, CELL, CELL);

          // sample the terrain in rotated space so the pattern turns while
          // each glyph stays put on the fixed screen grid
          const rx = x * ca - y * sa;
          const ry = x * sa + y * ca;

          const n = p.noise((rx + 1000) * 0.02, (ry + 1000) * 0.02);
          const light = p.constrain(p.map(-x - y, -RADIUS * 1.4, RADIUS * 1.4, 1, 0), 0, 1);
          let shade = n * 0.6 + light * 0.4;

          let craterDark = 0;
          for (const c of craters) {
            const cd = p.dist(rx, ry, c.x, c.y);
            if (cd < c.r) craterDark = p.max(craterDark, p.map(cd, 0, c.r, 0.35, 0));
          }
          shade -= craterDark;

          let tone;
          if (shade > 0.72) tone = 4;
          else if (shade > 0.52) tone = 3;
          else if (shade > 0.32) tone = 2;
          else if (shade > 0.14) tone = 1;
          else tone = 0;

          const col = PALETTE[tone];
          p.fill(col[0], col[1], col[2]);
          p.text(RAMP[tone], x + CELL / 2, y + CELL / 2);
        }
      }

      // the orbiting ring: small ASCII glyphs of mixed sizes sweeping
      // around the planet on the same Z axis, matching the main planet's
      // character-built look instead of drawing vector circles
      const orbitAngle = p.frameCount * ORBIT_SPEED;
      p.fill(0, 0, 0);
      for (const s of satellites) {
        const sa2 = s.angle + orbitAngle;
        const sx = p.cos(sa2) * s.orbitRadius;
        const sy = p.sin(sa2) * s.orbitRadius;
        let tier;
        if (s.size < 5.25) tier = 0;
        else if (s.size < 7.5) tier = 1;
        else if (s.size < 9.75) tier = 2;
        else tier = 3;
        p.textSize(s.size * 1.4);
        p.text(SATELLITE_RAMP[tier], sx, sy);
      }
      p.textSize(CELL * 1.3);

      p.pop();
    };
  };

  new p5(sketch);
</script>
